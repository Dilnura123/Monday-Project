<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой день и рутина</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>

<div class="app-container">
    <h2>Мой день и рутина</h2>
    <div class="pet-card">
        <div class="pet-avatar" id="petAvatar">🦜</div>
        <div class="pet-info">
            <div class="pet-name">Птичка Киви в путешествии 🌍</div>
            <div class="pet-status" id="petStatus">Выполняй задачи, чтобы отправить Киви за сокровищами!</div>
            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
        </div>
    </div>

    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tasks')">Задачи</button>
        <button class="tab-btn" onclick="switchTab('habits')">Привычки</button>
    </div>

    
    <div class="row">
        <input type="text" id="taskInput" placeholder="Что нужно сделать для себя?">
        <button class="add-btn" onclick="addTask()">Добавить</button>
    </div>

    
    <div class="row">
        <select id="timeSelect">
            <option value="🌅 Утро">🌅 Утро</option>
            <option value="☀️ День">☀️ День</option>
            <option value="🌙 Вечер">🌙 Вечер</option>
        </select>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all')">Все</button>
        <button class="filter-btn" onclick="setFilter('active')">Активные</button>
        <button class="filter-btn" onclick="setFilter('completed')">Готово</button>
    </div>

    <ul id="taskList"></ul>

    
    <div class="bottom-actions">
        <button class="link-btn" onclick="alert('Птичка пришлет доброе напоминание!')">🔔 Включить напоминания</button>
        <button class="link-btn" onclick="clearCompleted()" style="color: #ef4444;">Удалить выполненные</button>
    </div>
</div>

 <div id="intro">
  <div class="wing left"></div>
  <div class="wing right"></div>
  <div class="intro-center">
    <div class="intro-bird">🦜</div>
    <h1>Мой день и рутина</h1>
    <button id="startBtn">Старт</button>
  </div>
</div>

<div id="taskList"></div>
<script src="script.js"></script>

</body>
</html>
